name: iOS Build and Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: cleaneveryday-mobile.csproj

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pin SDK to .NET 9 for this runner
        run: echo '{"sdk":{"version":"9.0.0","rollForward":"latestMinor"}}' > global.json

      - name: Install MAUI workload (pinned to iOS 18 SDK)
        run: |
          dotnet workload install maui-ios \
            --from-rollback-file .github/workload-rollback-ios18.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }} -p:TargetFramework=net9.0-ios -p:RuntimeIdentifier=ios-arm64

      - name: Build iOS (Release)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -f net9.0-ios \
            -c Release \
            --no-restore \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -o ./publish/ios

      - name: Upload IPA and dSYM files
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            publish/ios/**/*.ipa
            publish/ios/**/*.dSYM
            publish/ios/**/*.dSYM/**
          if-no-files-found: warn
