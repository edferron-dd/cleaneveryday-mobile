name: iOS Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Pin to 10.0.100 feature band so the rollback file's manifest versions
  # (which target 10.0.100) are applied to the active SDK feature band.
  # The rollback pins ios SDK to 26.2.10233 (iOS 26.2, requires Xcode 26.3).
  # Update to 10.0.x and remove the rollback file once GitHub runners
  # include Xcode 26.5 and the latest maui-ios workload is used instead.
  DOTNET_VERSION: "10.0.100"
  PROJECT_PATH: cleaneveryday-mobile.csproj

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: dotnet
          api_key: ${{secrets.DD_API_KEY}}
          site: datadoghq.com

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pin SDK to 10.0.100 feature band
        run: echo '{"sdk":{"version":"10.0.100","rollForward":"latestPatch"}}' > global.json

      - name: Install MAUI workload (pinned to iOS 26.2 SDK)
        run: |
          dotnet workload install maui-ios \
            --from-rollback-file .github/workload-rollback-ios26.3.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }} -p:TargetFramework=net10.0-ios -p:RuntimeIdentifier=iossimulator-x64

      - name: Build iOS (Simulator Release)
        run: |
          dotnet build ${{ env.PROJECT_PATH }} \
            -f net10.0-ios \
            -c Release \
            --no-restore \
            -p:RuntimeIdentifier=iossimulator-x64

      - name: Upload simulator app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-release
          path: bin/Release/net10.0-ios/iossimulator-x64/**/*.app
          if-no-files-found: warn
